services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: site_generated
      POSTGRES_USER: site_generated
      POSTGRES_PASSWORD: site_generated
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  adminer:
    image: adminer:4
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  postgres_data:
